services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MONITORING_MAX_SNAPSHOT_AGE_SECONDS: ${MONITORING_MAX_SNAPSHOT_AGE_SECONDS:-300}
      TRADING_DB_PATH: /data/trade_desk.sqlite3
      HF_HOME: /models/huggingface
    volumes:
      - trade_data:/data
      - model_cache:/models
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  trade_data:
  model_cache:
